    <body>

        <div class="window start">
            <div>
                <h1>Number Memorization Game</h1>
                <p>9 boxes numbered 1-9 will appear on the screen. Once you've clicked the first box, all the numbers will disappear. Your goal is to click every box in order from 1 to 9.</p>
                <button class="begin">Start</button>
            </div>
        </div>
        
        <div class="window end">
            <div>
                <h1>Number Memorization Game</h1>
                <h3 class="score"></h3>
                <button class="new">New Session</button>
                <button class="begin">Try Again</button>
            </div>
        </div>
